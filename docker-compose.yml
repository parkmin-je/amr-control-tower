version: '3.8'

services:

  # ── Infrastructure ────────────────────────────────────────────────
  # Redis — 세션 저장소 + Gateway Rate Limiter 카운터
  # Why Redis: 인메모리 Key-Value 로 세션/카운터 연산이 O(1),
  #            AOF 옵션으로 재시작 시 카운터 유실 없이 Rate Limit 우회 방지
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - amr-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── HTTPS 진입점 ──────────────────────────────────────────────────
  # Nginx — TLS 종단 + 리버스 프록시 + WebSocket 지원
  # 인증서: Let's Encrypt (certbot 컨테이너로 발급·갱신)
  # 초기 발급 명령 (최초 1회):
  #   docker-compose run --rm certbot certonly --webroot \
  #     -w /var/www/certbot -d ${DOMAIN} \
  #     --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - amr-dashboard
    networks:
      - amr-net

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;"
    networks:
      - amr-net


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - amr-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - amr-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-amrroot}
      MYSQL_DATABASE: amrdb
      MYSQL_USER: ${MYSQL_USER:-amr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-amrpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - amr-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Monitoring ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - amr-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - amr-net

  # ── MSA: 서비스 디스커버리 ─────────────────────────────────────────
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile.eureka
    ports:
      - "8761:8761"
    networks:
      - amr-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── MSA: API Gateway (외부 진입점) ────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - REDIS_HOST=redis
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amr-net

  # ── 대시보드 서비스 ────────────────────────────────────────────────
  amr-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - MYSQL_USER=${MYSQL_USER:-amr}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-amrpass}
      - ROSBRIDGE_ROBOT_01_URI=${ROSBRIDGE_ROBOT_01_URI:-ws://192.168.109.130:9090}
      - REDIS_HOST=redis
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amr-net

networks:
  amr-net:
    driver: bridge

volumes:
  mysql-data:
  grafana-data:
  redis-data:
