server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Eureka를 통한 서비스 디스커버리 기반 라우팅
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 대시보드 서비스 — 모든 요청을 amr-dashboard 로 라우팅
        - id: amr-dashboard
          uri: lb://amr-dashboard
          predicates:
            - Path=/**
          filters:
            - name: CircuitBreaker
              args:
                name: dashboard-cb
                fallbackUri: forward:/fallback

      # 글로벌 CORS 설정
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    gateway:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    org.springframework.cloud.gateway: INFO
