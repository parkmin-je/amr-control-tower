<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet — AMR Control Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script th:src="@{/js/i18n.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { overflow: auto; }
        .main { overflow-y: auto; }

        .content { padding: 1.25rem; }

        .fleet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .robot-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            transition: border-color 0.2s;
        }

        .robot-card.state-moving         { border-color: rgba(96,165,250,0.4); }
        .robot-card.state-emergency-stop { border-color: rgba(248,113,113,0.4); }
        .robot-card.state-error          { border-color: rgba(248,113,113,0.4); }
        .robot-card.state-charging       { border-color: rgba(74,222,128,0.3); }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.875rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .card-robot-id {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
        }

        .card-telem {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 0.75rem;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
        }

        .card-key { color: var(--text-3); }
        .card-val { color: var(--text-2); font-family: 'JetBrains Mono', monospace; }

        .card-battery-wrap { margin-bottom: 0.75rem; }

        .card-battery-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-3);
            margin-bottom: 4px;
        }

        .card-battery-bar { height: 4px; background: var(--surface-2); border-radius: 100px; overflow: hidden; }
        .card-battery-fill { height: 100%; border-radius: 100px; transition: width 0.5s ease, background 0.3s; }

        .card-actions { display: flex; gap: 0.375rem; }
        .card-estop {
            flex: 1; padding: 0.4rem; border-radius: 5px; font-size: 0.72rem; font-weight: 600;
            background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--red);
            cursor: pointer; transition: background 0.12s;
        }
        .card-estop:hover { background: rgba(248,113,113,0.2); }
        .card-resume {
            flex: 1; padding: 0.4rem; border-radius: 5px; font-size: 0.72rem; font-weight: 600;
            background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); color: var(--green);
            cursor: pointer; transition: background 0.12s;
        }
        .card-resume:hover { background: rgba(74,222,128,0.16); }
    </style>
</head>
<body>
<div class="sidenav-overlay" id="sidenav-overlay" onclick="closeSidenav()"></div>
<div class="layout">

    <!-- Sidebar nav -->
    <nav th:replace="~{fragments/sidenav :: sidenav('fleet')}"></nav>

    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="toggleSidenav()" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
                <h1 class="page-title" data-i18n="nav.fleet">Fleet</h1>
                <div class="sys-pill">
                    <span class="pill-label" data-i18n="label.units">Units</span>
                    <span class="pill-val" th:text="${robots.size()}">1</span>
                </div>
            </div>
            <div class="topbar-right">
                <button class="cmd-btn cmd-estop" sec:authorize="hasAnyRole('OPERATOR','ADMIN')"
                        onclick="fleetEstop()" data-i18n="fleet.estopAll"
                        style="font-size:0.72rem; padding:0.3rem 0.75rem;">Fleet E-Stop</button>
                <div class="lang-picker">
                    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
                    <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">한</button>
                    <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
                </div>
            </div>
        </header>

        <div class="content">
            <div class="fleet-grid" id="fleet-grid">
                <div th:each="robot : ${robots}" class="robot-card" th:id="'card-' + ${robot.robotId}">
                    <div class="card-header">
                        <span class="card-robot-id" th:text="${robot.robotId}">robot-01</span>
                        <span class="state-badge state-idle" th:id="'state-' + ${robot.robotId}">Idle</span>
                    </div>
                    <div class="card-telem">
                        <div class="card-row">
                            <span class="card-key" data-i18n="label.posX">Pos X</span>
                            <span class="card-val" th:id="'posX-' + ${robot.robotId}">—</span>
                        </div>
                        <div class="card-row">
                            <span class="card-key" data-i18n="label.posY">Pos Y</span>
                            <span class="card-val" th:id="'posY-' + ${robot.robotId}">—</span>
                        </div>
                        <div class="card-row">
                            <span class="card-key" data-i18n="label.linearVel">Linear vel</span>
                            <span class="card-val" th:id="'linVel-' + ${robot.robotId}">—</span>
                        </div>
                        <div class="card-row">
                            <span class="card-key" data-i18n="fleet.updated">Updated</span>
                            <span class="card-val" th:id="'time-' + ${robot.robotId}">—</span>
                        </div>
                    </div>
                    <div class="card-battery-wrap">
                        <div class="card-battery-label">
                            <span data-i18n="label.battery">Battery</span>
                            <span th:id="'bat-pct-' + ${robot.robotId}">—%</span>
                        </div>
                        <div class="card-battery-bar">
                            <div class="card-battery-fill" th:id="'bat-fill-' + ${robot.robotId}" style="width:0%"></div>
                        </div>
                    </div>
                    <div class="card-actions" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                        <button class="card-estop" th:data-rid="${robot.robotId}" onclick="estop(this.dataset.rid)" data-i18n="ctrl.estop">E-Stop</button>
                        <button class="card-resume" th:data-rid="${robot.robotId}" onclick="resume(this.dataset.rid)" data-i18n="ctrl.resume">Resume</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const ROBOTS = /*[[${robots}]]*/ [];
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, () => {
            ROBOTS.forEach(r => subscribeRobot(r.robotId));
        }, () => setTimeout(connect, 3000));
    }

    function subscribeRobot(robotId) {
        stompClient.subscribe(`/topic/robot/${robotId}/status`, msg => {
            const d = JSON.parse(msg.body);
            setText(`posX-${robotId}`,    d.posX.toFixed(3) + ' m');
            setText(`posY-${robotId}`,    d.posY.toFixed(3) + ' m');
            setText(`linVel-${robotId}`,  d.linearVel.toFixed(3) + ' m/s');
            setText(`time-${robotId}`,    new Date().toLocaleTimeString());
            updateBattery(robotId, d.battery);
            updateState(robotId, d.robotState);
        });
    }

    function setText(id, val) {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
    }

    function updateBattery(robotId, pct) {
        const pctEl  = document.getElementById(`bat-pct-${robotId}`);
        const fillEl = document.getElementById(`bat-fill-${robotId}`);
        if (!pctEl || !fillEl) return;
        pctEl.textContent = pct + '%';
        pctEl.style.color = pct > 50 ? '#4ade80' : pct > 20 ? '#fbbf24' : '#f87171';
        fillEl.style.width = pct + '%';
        fillEl.style.background = pct > 50 ? '#4ade80' : pct > 20 ? '#fbbf24' : '#f87171';
    }

    function updateState(robotId, state) {
        const badge = document.getElementById(`state-${robotId}`);
        const card  = document.getElementById(`card-${robotId}`);
        if (!badge || !card) return;
        const labels = { IDLE: 'Idle', MOVING: 'Moving', EMERGENCY_STOP: 'E-Stop', CHARGING: 'Charging', ERROR: 'Error' };
        badge.textContent = labels[state] || state;
        badge.className = 'state-badge state-' + state.toLowerCase().replace(/_/g, '-');
        card.className = 'robot-card state-' + state.toLowerCase().replace(/_/g, '-');
    }

    function estop(robotId) {
        fetch(`/api/robot/${robotId}/command/estop`, { method: 'POST' })
            .then(r => r.ok ? showToast(`[${robotId}] 긴급 정지 실행`, 'success') : showToast(`[${robotId}] E-Stop 실패`, 'error'));
    }
    function resume(robotId) {
        fetch(`/api/robot/${robotId}/command/estop/clear`, { method: 'POST' })
            .then(r => r.ok ? showToast(`[${robotId}] 정지 해제`, 'success') : showToast(`[${robotId}] 해제 실패`, 'error'));
    }

    function fleetEstop() {
        if (!confirm('전체 로봇에 긴급 정지를 실행합니다. 계속하시겠습니까?')) return;
        fetch('/api/fleet/command/estop', { method: 'POST' })
            .then(r => r.ok ? showToast('Fleet 긴급 정지 실행', 'success') : showToast('Fleet E-Stop 실패', 'error'));
    }

    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function toggleSidenav() {
        document.querySelector('.sidenav').classList.toggle('open');
        document.getElementById('sidenav-overlay').classList.toggle('open');
    }
    function closeSidenav() {
        document.querySelector('.sidenav').classList.remove('open');
        document.getElementById('sidenav-overlay').classList.remove('open');
    }

    connect();
</script>
</body>
</html>
