<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet — AMR Control Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script th:src="@{/js/i18n.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { overflow: auto; }
        .main { overflow-y: auto; }

        .content { padding: 1.25rem; }

        .fleet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .robot-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            transition: border-color 0.2s;
        }

        .robot-card.state-moving         { border-color: rgba(96,165,250,0.4); }
        .robot-card.state-emergency-stop { border-color: rgba(248,113,113,0.4); }
        .robot-card.state-error          { border-color: rgba(248,113,113,0.4); }
        .robot-card.state-charging       { border-color: rgba(74,222,128,0.3); }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.875rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .card-robot-id {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
        }

        .card-telem {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 0.75rem;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
        }

        .card-key { color: var(--text-3); }
        .card-val { color: var(--text-2); font-family: 'JetBrains Mono', monospace; }

        .card-battery-wrap { margin-bottom: 0.75rem; }

        .card-battery-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-3);
            margin-bottom: 4px;
        }

        .card-battery-bar { height: 4px; background: var(--surface-2); border-radius: 100px; overflow: hidden; }
        .card-battery-fill { height: 100%; border-radius: 100px; transition: width 0.5s ease, background 0.3s; }

        .card-actions { display: flex; gap: 0.375rem; }
        .card-estop {
            flex: 1; padding: 0.4rem; border-radius: 5px; font-size: 0.72rem; font-weight: 600;
            background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.25); color: var(--red);
            cursor: pointer; transition: background 0.12s;
        }
        .card-estop:hover { background: rgba(248,113,113,0.2); }
        .card-resume {
            flex: 1; padding: 0.4rem; border-radius: 5px; font-size: 0.72rem; font-weight: 600;
            background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); color: var(--green);
            cursor: pointer; transition: background 0.12s;
        }
        .card-resume:hover { background: rgba(74,222,128,0.16); }
    </style>
</head>
<body>
<div class="sidenav-overlay" id="sidenav-overlay" onclick="closeSidenav()"></div>
<div class="layout">

    <!-- Sidebar nav -->
    <nav class="sidenav">
        <div class="sidenav-brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 0 0 2.25-2.25V6.75a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 6.75v10.5a2.25 2.25 0 0 0 2.25 2.25Zm.75-12h9v9h-9v-9Z"/>
                </svg>
            </div>
            <span class="brand-text">Control Tower</span>
        </div>
        <div class="sidenav-links">
            <a href="/" class="sidenav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/></svg><span data-i18n="nav.dashboard">Dashboard</span></a>
            <a href="/fleet" class="sidenav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg><span data-i18n="nav.fleet">Fleet</span></a>
            <a href="/tasks" class="sidenav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"/></svg><span data-i18n="nav.tasks">Tasks</span></a>
            <a href="/admin" class="sidenav-link" sec:authorize="hasRole('ADMIN')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg><span data-i18n="nav.admin">Admin</span></a>
        </div>
        <div class="sidenav-footer">
            <div class="user-info">
                <div class="user-avatar" th:text="${#strings.substring(username, 0, 1).toUpperCase()}">U</div>
                <span class="user-name" th:text="${username}">user</span>
            </div>
            <a href="/logout" class="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
            </a>
        </div>
    </nav>

    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="toggleSidenav()" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
                <h1 class="page-title" data-i18n="nav.fleet">Fleet</h1>
                <div class="sys-pill">
                    <span class="pill-label" data-i18n="label.units">Units</span>
                    <span class="pill-val" th:text="${robots.size()}">1</span>
                </div>
            </div>
            <div class="topbar-right">
                <button class="cmd-btn cmd-estop" sec:authorize="hasAnyRole('OPERATOR','ADMIN')"
                        onclick="fleetEstop()" data-i18n="fleet.estopAll"
                        style="font-size:0.72rem; padding:0.3rem 0.75rem;">Fleet E-Stop</button>
                <div class="lang-picker">
                    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
                    <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">한</button>
                    <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
                </div>
            </div>
        </header>

        <div class="content">
            <div class="fleet-grid" id="fleet-grid">
                <div th:each="robot : ${robots}" class="robot-card" th:id="'card-' + ${robot.robotId}">
                    <div class="card-header">
                        <span class="card-robot-id" th:text="${robot.robotId}">robot-01</span>
                        <span class="state-badge state-idle" th:id="'state-' + ${robot.robotId}">Idle</span>
                    </div>
                    <div class="card-telem">
                        <div class="card-row">
                            <span class="card-key" data-i18n="label.posX">Pos X</span>
                            <span class="card-val" th:id="'posX-' + ${robot.robotId}">—</span>
                        </div>
                        <div class="card-row">
                            <span class="card-key" data-i18n="label.posY">Pos Y</span>
                            <span class="card-val" th:id="'posY-' + ${robot.robotId}">—</span>
                        </div>
                        <div class="card-row">
                            <span class="card-key" data-i18n="label.linearVel">Linear vel</span>
                            <span class="card-val" th:id="'linVel-' + ${robot.robotId}">—</span>
                        </div>
                        <div class="card-row">
                            <span class="card-key" data-i18n="fleet.updated">Updated</span>
                            <span class="card-val" th:id="'time-' + ${robot.robotId}">—</span>
                        </div>
                    </div>
                    <div class="card-battery-wrap">
                        <div class="card-battery-label">
                            <span data-i18n="label.battery">Battery</span>
                            <span th:id="'bat-pct-' + ${robot.robotId}">—%</span>
                        </div>
                        <div class="card-battery-bar">
                            <div class="card-battery-fill" th:id="'bat-fill-' + ${robot.robotId}" style="width:0%"></div>
                        </div>
                    </div>
                    <div class="card-actions" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                        <button class="card-estop" th:data-rid="${robot.robotId}" onclick="estop(this.dataset.rid)" data-i18n="ctrl.estop">E-Stop</button>
                        <button class="card-resume" th:data-rid="${robot.robotId}" onclick="resume(this.dataset.rid)" data-i18n="ctrl.resume">Resume</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const ROBOTS = /*[[${robots}]]*/ [];
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, () => {
            ROBOTS.forEach(r => subscribeRobot(r.robotId));
        }, () => setTimeout(connect, 3000));
    }

    function subscribeRobot(robotId) {
        stompClient.subscribe(`/topic/robot/${robotId}/status`, msg => {
            const d = JSON.parse(msg.body);
            setText(`posX-${robotId}`,    d.posX.toFixed(3) + ' m');
            setText(`posY-${robotId}`,    d.posY.toFixed(3) + ' m');
            setText(`linVel-${robotId}`,  d.linearVel.toFixed(3) + ' m/s');
            setText(`time-${robotId}`,    new Date().toLocaleTimeString());
            updateBattery(robotId, d.battery);
            updateState(robotId, d.robotState);
        });
    }

    function setText(id, val) {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
    }

    function updateBattery(robotId, pct) {
        const pctEl  = document.getElementById(`bat-pct-${robotId}`);
        const fillEl = document.getElementById(`bat-fill-${robotId}`);
        if (!pctEl || !fillEl) return;
        pctEl.textContent = pct + '%';
        pctEl.style.color = pct > 50 ? '#4ade80' : pct > 20 ? '#fbbf24' : '#f87171';
        fillEl.style.width = pct + '%';
        fillEl.style.background = pct > 50 ? '#4ade80' : pct > 20 ? '#fbbf24' : '#f87171';
    }

    function updateState(robotId, state) {
        const badge = document.getElementById(`state-${robotId}`);
        const card  = document.getElementById(`card-${robotId}`);
        if (!badge || !card) return;
        const labels = { IDLE: 'Idle', MOVING: 'Moving', EMERGENCY_STOP: 'E-Stop', CHARGING: 'Charging', ERROR: 'Error' };
        badge.textContent = labels[state] || state;
        badge.className = 'state-badge state-' + state.toLowerCase().replace(/_/g, '-');
        card.className = 'robot-card state-' + state.toLowerCase().replace(/_/g, '-');
    }

    function estop(robotId) {
        fetch(`/api/robot/${robotId}/command/estop`, { method: 'POST' })
            .then(r => r.ok ? showToast(`[${robotId}] 긴급 정지 실행`, 'success') : showToast(`[${robotId}] E-Stop 실패`, 'error'));
    }
    function resume(robotId) {
        fetch(`/api/robot/${robotId}/command/estop/clear`, { method: 'POST' })
            .then(r => r.ok ? showToast(`[${robotId}] 정지 해제`, 'success') : showToast(`[${robotId}] 해제 실패`, 'error'));
    }

    function fleetEstop() {
        if (!confirm('전체 로봇에 긴급 정지를 실행합니다. 계속하시겠습니까?')) return;
        fetch('/api/fleet/command/estop', { method: 'POST' })
            .then(r => r.ok ? showToast('Fleet 긴급 정지 실행', 'success') : showToast('Fleet E-Stop 실패', 'error'));
    }

    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function toggleSidenav() {
        document.querySelector('.sidenav').classList.toggle('open');
        document.getElementById('sidenav-overlay').classList.toggle('open');
    }
    function closeSidenav() {
        document.querySelector('.sidenav').classList.remove('open');
        document.getElementById('sidenav-overlay').classList.remove('open');
    }

    connect();
</script>
</body>
</html>
