<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — AMR Control Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #09090b;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrap {
            width: 100%;
            max-width: 360px;
            padding: 1rem;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            color: #a1a1aa;
        }

        .brand h1 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fafafa;
            letter-spacing: 0.02em;
        }

        .brand p {
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 0.25rem;
        }

        .card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 1.75rem;
        }

        .alert {
            font-size: 0.8rem;
            padding: 0.625rem 0.875rem;
            border-radius: 6px;
            margin-bottom: 1.25rem;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #a1a1aa;
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 6px;
            color: #fafafa;
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus {
            border-color: #52525b;
        }

        input::placeholder { color: #52525b; }

        button[type="submit"] {
            width: 100%;
            padding: 0.625rem;
            background: #fafafa;
            color: #09090b;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.15s;
        }

        button[type="submit"]:hover { background: #e4e4e7; }

        .footer-note {
            text-align: center;
            font-size: 0.72rem;
            color: #52525b;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 0 0 2.25-2.25V6.75a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 6.75v10.5a2.25 2.25 0 0 0 2.25 2.25Zm.75-12h9v9h-9v-9Z"/>
            </svg>
        </div>
        <h1>AMR Control Tower</h1>
        <p>Fleet Management System</p>
    </div>

    <div class="card">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit">Sign in</button>
        </form>
    </div>

    <p class="footer-note">AMR Control Tower &copy; 2025</p>
</div>
</body>
</html>
