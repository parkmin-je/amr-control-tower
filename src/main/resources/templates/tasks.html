<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks — AMR Control Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        body { overflow: auto; }
        .main { overflow-y: auto; }

        /* Page-specific styles */
        .content { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-title { font-size: 0.85rem; font-weight: 600; color: var(--text); }

        .btn-primary {
            padding: 0.4rem 0.875rem;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.12s;
        }
        .btn-primary:hover { background: #e4e4e7; }

        /* Create Task Form */
        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }

        .form-card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.25rem; }

        .form-group label {
            font-size: 0.7rem;
            color: var(--text-3);
            font-weight: 500;
        }

        .form-input, .form-select {
            padding: 0.4rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-size: 0.78rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.12s;
        }
        .form-input:focus, .form-select:focus { border-color: var(--border-2); }
        .form-select option { background: var(--surface); }

        .form-actions { display: flex; justify-content: flex-end; margin-top: 0.75rem; }

        /* Tasks table */
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .table-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            padding: 0.5rem 1rem;
            text-align: left;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        tbody td {
            padding: 0.625rem 1rem;
            font-size: 0.78rem;
            color: var(--text-2);
            border-bottom: 1px solid rgba(39,39,42,0.5);
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.02); color: var(--text); }

        .td-mono { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; }

        .task-status {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.18rem 0.5rem;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-queued    { background: rgba(63,63,70,0.5);   color: var(--text-3); }
        .status-executing { background: rgba(96,165,250,0.12); color: var(--blue); }
        .status-paused    { background: rgba(251,191,36,0.12); color: var(--amber); }
        .status-completed { background: rgba(74,222,128,0.12); color: var(--green); }
        .status-failed    { background: rgba(248,113,113,0.12); color: var(--red); }
        .status-cancelled { background: rgba(63,63,70,0.5);   color: var(--text-3); }

        .action-btn {
            padding: 0.18rem 0.5rem;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-3);
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
            margin-right: 3px;
        }
        .action-btn:hover { background: var(--surface-2); color: var(--text); }
        .action-btn.danger { color: var(--red); border-color: rgba(248,113,113,0.2); }
        .action-btn.danger:hover { background: rgba(248,113,113,0.08); }
        .action-btn.success { color: var(--green); border-color: rgba(74,222,128,0.2); }
        .action-btn.success:hover { background: rgba(74,222,128,0.08); }

        .priority-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .p1 { background: var(--red); }
        .p2 { background: var(--amber); }
        .p3 { background: var(--blue); }
        .p4, .p5 { background: var(--text-3); }
    </style>
</head>
<body>
<div class="layout">

    <!-- Sidebar nav (same as dashboard) -->
    <nav class="sidenav">
        <div class="sidenav-brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 0 0 2.25-2.25V6.75a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 6.75v10.5a2.25 2.25 0 0 0 2.25 2.25Zm.75-12h9v9h-9v-9Z"/>
                </svg>
            </div>
            <span class="brand-text">Control Tower</span>
        </div>
        <div class="sidenav-links">
            <a href="/" class="sidenav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/fleet" class="sidenav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg>
                <span>Fleet</span>
            </a>
            <a href="/tasks" class="sidenav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"/></svg>
                <span>Tasks</span>
            </a>
            <a href="/admin" class="sidenav-link" sec:authorize="hasRole('ADMIN')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                <span>Admin</span>
            </a>
        </div>
        <div class="sidenav-footer">
            <div class="user-info">
                <div class="user-avatar" sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">A</div>
                <span class="user-name" sec:authentication="name">user</span>
            </div>
            <a href="/logout" class="logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
            </a>
        </div>
    </nav>

    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <h1 class="page-title">Tasks</h1>
            </div>
        </header>

        <div class="content">

            <!-- Create Task form (OPERATOR/ADMIN only) -->
            <div class="form-card" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                <div class="form-card-title">New Task</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Robot</label>
                        <select id="f-robot" class="form-select">
                            <option th:each="r : ${robots}" th:value="${r.robotId}" th:text="${r.displayName ?: r.robotId}">robot-01</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Title</label>
                        <input id="f-title" type="text" class="form-input" placeholder="Go to station A">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="f-type" class="form-select">
                            <option th:each="t : ${taskTypes}" th:value="${t}" th:text="${t}">NAVIGATE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>X (m)</label>
                        <input id="f-x" type="number" step="0.1" value="0" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Y (m)</label>
                        <input id="f-y" type="number" step="0.1" value="0" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Theta (rad)</label>
                        <input id="f-theta" type="number" step="0.1" value="0" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Priority (1=high)</label>
                        <select id="f-priority" class="form-select">
                            <option value="1">1 — High</option>
                            <option value="2">2</option>
                            <option value="3" selected>3 — Normal</option>
                            <option value="4">4</option>
                            <option value="5">5 — Low</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2">
                        <label>Description</label>
                        <input id="f-desc" type="text" class="form-input" placeholder="Optional notes">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" onclick="createTask()">Create Task</button>
                </div>
            </div>

            <!-- Tasks table -->
            <div class="table-card">
                <div class="table-header">
                    <span class="table-title">All Tasks</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Robot</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Created by</th>
                            <th>Created at</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="task-tbody">
                        <tr th:each="t : ${tasks}">
                            <td class="td-mono" th:text="${t.id}">1</td>
                            <td class="td-mono" th:text="${t.robotId}">robot-01</td>
                            <td th:text="${t.title}">Go to A</td>
                            <td class="td-mono" th:text="${t.type}">NAVIGATE</td>
                            <td>
                                <span class="task-status"
                                      th:classappend="'status-' + ${t.status.name().toLowerCase()}"
                                      th:text="${t.status}">QUEUED</span>
                            </td>
                            <td>
                                <span th:class="'priority-dot p' + ${t.priority}"></span>
                                <span th:text="${t.priority}">3</span>
                            </td>
                            <td th:text="${t.createdBy}">admin</td>
                            <td class="td-mono" th:text="${#temporals.format(t.createdAt,'MM-dd HH:mm')}">01-01 12:00</td>
                            <td sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                                <button class="action-btn success"
                                        th:if="${t.status.name() == 'QUEUED' or t.status.name() == 'PAUSED'}"
                                        th:data-tid="${t.id}" data-action="execute"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Run</button>
                                <button class="action-btn"
                                        th:if="${t.status.name() == 'EXECUTING'}"
                                        th:data-tid="${t.id}" data-action="pause"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Pause</button>
                                <button class="action-btn"
                                        th:if="${t.status.name() == 'EXECUTING'}"
                                        th:data-tid="${t.id}" data-action="complete"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Done</button>
                                <button class="action-btn danger"
                                        th:if="${t.status.name() != 'COMPLETED' and t.status.name() != 'CANCELLED'}"
                                        th:data-tid="${t.id}" data-action="cancel"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Cancel</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
function createTask() {
    const body = {
        robotId:     document.getElementById('f-robot').value,
        title:       document.getElementById('f-title').value,
        type:        document.getElementById('f-type').value,
        targetX:     parseFloat(document.getElementById('f-x').value) || 0,
        targetY:     parseFloat(document.getElementById('f-y').value) || 0,
        targetTheta: parseFloat(document.getElementById('f-theta').value) || 0,
        description: document.getElementById('f-desc').value,
        priority:    parseInt(document.getElementById('f-priority').value)
    };
    fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    }).then(r => { if (r.ok) location.reload(); else r.json().then(e => alert(e.message || 'Error')); });
}

function taskAction(id, action) {
    fetch(`/api/tasks/${id}/${action}`, { method: 'POST' })
        .then(r => { if (r.ok) location.reload(); else alert('Action failed'); });
}
</script>
</body>
</html>
