<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks — AMR Control Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script th:src="@{/js/i18n.js}"></script>
    <style>
        body { overflow: auto; }
        .main { overflow-y: auto; }

        /* Page-specific styles */
        .content { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-title { font-size: 0.85rem; font-weight: 600; color: var(--text); }

        .btn-primary {
            padding: 0.4rem 0.875rem;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.12s;
        }
        .btn-primary:hover { background: #e4e4e7; }

        /* Create Task Form */
        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }

        .form-card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.25rem; }

        .form-group label {
            font-size: 0.7rem;
            color: var(--text-3);
            font-weight: 500;
        }

        .form-input, .form-select {
            padding: 0.4rem 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-size: 0.78rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.12s;
        }
        .form-input:focus, .form-select:focus { border-color: var(--border-2); }
        .form-select option { background: var(--surface); }

        .form-actions { display: flex; justify-content: flex-end; margin-top: 0.75rem; }

        /* Tasks table */
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .table-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            padding: 0.5rem 1rem;
            text-align: left;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        tbody td {
            padding: 0.625rem 1rem;
            font-size: 0.78rem;
            color: var(--text-2);
            border-bottom: 1px solid rgba(39,39,42,0.5);
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.02); color: var(--text); }

        .td-mono { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; }

        .task-status {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.18rem 0.5rem;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-queued    { background: rgba(63,63,70,0.5);   color: var(--text-3); }
        .status-executing { background: rgba(96,165,250,0.12); color: var(--blue); }
        .status-paused    { background: rgba(251,191,36,0.12); color: var(--amber); }
        .status-completed { background: rgba(74,222,128,0.12); color: var(--green); }
        .status-failed    { background: rgba(248,113,113,0.12); color: var(--red); }
        .status-cancelled { background: rgba(63,63,70,0.5);   color: var(--text-3); }

        .action-btn {
            padding: 0.18rem 0.5rem;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-3);
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
            margin-right: 3px;
        }
        .action-btn:hover { background: var(--surface-2); color: var(--text); }
        .action-btn.danger { color: var(--red); border-color: rgba(248,113,113,0.2); }
        .action-btn.danger:hover { background: rgba(248,113,113,0.08); }
        .action-btn.success { color: var(--green); border-color: rgba(74,222,128,0.2); }
        .action-btn.success:hover { background: rgba(74,222,128,0.08); }

        .priority-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .p1 { background: var(--red); }
        .p2 { background: var(--amber); }
        .p3 { background: var(--blue); }
        .p4, .p5 { background: var(--text-3); }
    </style>
</head>
<body>
<div class="sidenav-overlay" id="sidenav-overlay" onclick="closeSidenav()"></div>
<div class="layout">

    <!-- Sidebar nav -->
    <nav th:replace="~{fragments/sidenav :: sidenav('tasks')}"></nav>

    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="toggleSidenav()" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
                <h1 class="page-title" data-i18n="nav.tasks">Tasks</h1>
            </div>
            <div class="topbar-right">
                <div class="lang-picker">
                    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
                    <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">한</button>
                    <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
                </div>
            </div>
        </header>

        <div class="content">

            <!-- Create Task form (OPERATOR/ADMIN only) -->
            <div class="form-card" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                <div class="form-card-title" data-i18n="task.newTask">NEW TASK</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label data-i18n="task.robot">Robot</label>
                        <select id="f-robot" class="form-select">
                            <option th:each="r : ${robots}" th:value="${r.robotId}" th:text="${r.displayName ?: r.robotId}">robot-01</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="task.title">Title</label>
                        <input id="f-title" type="text" class="form-input" placeholder="Go to station A">
                    </div>
                    <div class="form-group">
                        <label data-i18n="task.type">Type</label>
                        <select id="f-type" class="form-select">
                            <option th:each="t : ${taskTypes}" th:value="${t}" th:text="${t}">NAVIGATE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="ctrl.labelX">X (m)</label>
                        <input id="f-x" type="number" step="0.1" value="0" class="form-input">
                    </div>
                    <div class="form-group">
                        <label data-i18n="ctrl.labelY">Y (m)</label>
                        <input id="f-y" type="number" step="0.1" value="0" class="form-input">
                    </div>
                    <div class="form-group">
                        <label data-i18n="ctrl.labelTheta">Theta (rad)</label>
                        <input id="f-theta" type="number" step="0.1" value="0" class="form-input">
                    </div>
                    <div class="form-group">
                        <label data-i18n="task.priority">Priority (1=high)</label>
                        <select id="f-priority" class="form-select">
                            <option value="1">1 — High</option>
                            <option value="2">2</option>
                            <option value="3" selected>3 — Normal</option>
                            <option value="4">4</option>
                            <option value="5">5 — Low</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2">
                        <label data-i18n="task.description">Description</label>
                        <input id="f-desc" type="text" class="form-input" placeholder="Optional notes">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" onclick="createTask()" data-i18n="task.create">Create Task</button>
                </div>
            </div>

            <!-- Tasks table -->
            <div class="table-card">
                <div class="table-header">
                    <span class="table-title" data-i18n="task.allTasks">ALL TASKS</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="task.id">ID</th>
                            <th data-i18n="task.robot">ROBOT</th>
                            <th data-i18n="task.title">TITLE</th>
                            <th data-i18n="task.type">TYPE</th>
                            <th data-i18n="task.status">STATUS</th>
                            <th data-i18n="task.priority">PRIORITY</th>
                            <th data-i18n="task.createdBy">CREATED BY</th>
                            <th data-i18n="task.createdAt">CREATED AT</th>
                            <th data-i18n="task.actions">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="task-tbody">
                        <tr th:each="t : ${tasks}">
                            <td class="td-mono" th:text="${t.id}">1</td>
                            <td class="td-mono" th:text="${t.robotId}">robot-01</td>
                            <td th:text="${t.title}">Go to A</td>
                            <td class="td-mono" th:text="${t.type}">NAVIGATE</td>
                            <td>
                                <span class="task-status"
                                      th:classappend="'status-' + ${t.status.name().toLowerCase()}"
                                      th:text="${t.status}">QUEUED</span>
                            </td>
                            <td>
                                <span th:class="'priority-dot p' + ${t.priority}"></span>
                                <span th:text="${t.priority}">3</span>
                            </td>
                            <td th:text="${t.createdBy}">admin</td>
                            <td class="td-mono" th:text="${#temporals.format(t.createdAt,'MM-dd HH:mm')}">01-01 12:00</td>
                            <td sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                                <button class="action-btn success"
                                        th:if="${t.status.name() == 'QUEUED' or t.status.name() == 'PAUSED'}"
                                        th:data-tid="${t.id}" data-action="execute"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Run</button>
                                <button class="action-btn"
                                        th:if="${t.status.name() == 'EXECUTING'}"
                                        th:data-tid="${t.id}" data-action="pause"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Pause</button>
                                <button class="action-btn"
                                        th:if="${t.status.name() == 'EXECUTING'}"
                                        th:data-tid="${t.id}" data-action="complete"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Done</button>
                                <button class="action-btn danger"
                                        th:if="${t.status.name() != 'COMPLETED' and t.status.name() != 'CANCELLED'}"
                                        th:data-tid="${t.id}" data-action="cancel"
                                        onclick="taskAction(this.dataset.tid, this.dataset.action)">Cancel</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
function createTask() {
    const body = {
        robotId:     document.getElementById('f-robot').value,
        title:       document.getElementById('f-title').value,
        type:        document.getElementById('f-type').value,
        targetX:     parseFloat(document.getElementById('f-x').value) || 0,
        targetY:     parseFloat(document.getElementById('f-y').value) || 0,
        targetTheta: parseFloat(document.getElementById('f-theta').value) || 0,
        description: document.getElementById('f-desc').value,
        priority:    parseInt(document.getElementById('f-priority').value)
    };
    fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    }).then(r => { if (r.ok) location.reload(); else r.json().then(e => alert(e.message || 'Error')); });
}

function taskAction(id, action) {
    fetch(`/api/tasks/${id}/${action}`, { method: 'POST' })
        .then(r => { if (r.ok) location.reload(); else alert('Action failed'); });
}

function toggleSidenav() {
    document.querySelector('.sidenav').classList.toggle('open');
    document.getElementById('sidenav-overlay').classList.toggle('open');
}
function closeSidenav() {
    document.querySelector('.sidenav').classList.remove('open');
    document.getElementById('sidenav-overlay').classList.remove('open');
}
</script>
</body>
</html>
