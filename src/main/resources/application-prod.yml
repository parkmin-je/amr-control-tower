spring:
  datasource:
    url: jdbc:mysql://mysql:3306/amrdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:amr}
    password: ${MYSQL_PASSWORD:amrpass}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Redis — 분산 세션 저장소
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  session:
    store-type: redis
    timeout: 3600s
