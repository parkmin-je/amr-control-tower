spring:
  application:
    name: amr-dashboard

  profiles:
    active: dev

  thymeleaf:
    cache: false

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: amr-dashboard
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: "com.amr.dashboard.kafka.dto"

kafka:
  topics:
    robot-status: robot-status
    robot-event: robot-event

# ROS rosbridge 연결 설정 (로봇별 rosbridge URI 지정)
rosbridge:
  reconnect-delay-ms: 3000
  robots:
    - robot-id: robot-01
      uri: ws://192.168.109.130:9090
      odom-topic: /odom
      battery-topic: /battery_state
      map-topic: /map
      scan-topic: /scan

# 로봇 상태 저장 주기 (ms)
robot:
  status-save-interval-ms: 1000

server:
  port: 8080

# Eureka Client — 서비스 디스커버리 등록
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      robot-command:
        register-health-indicator: true
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        event-consumer-buffer-size: 10

# Actuator — Circuit Breaker + Prometheus + 분산 추적
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,metrics,prometheus
  health:
    circuitbreakers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 0.0

logging:
  level:
    com.amr.dashboard: DEBUG
