spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  datasource:
    url: jdbc:h2:mem:amrdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  session:
    store-type: none

# dev 환경에서는 Eureka 서버 없이 실행
eureka:
  client:
    enabled: false

# dev: 무거운 기능 비활성화
management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    export:
      prometheus:
        enabled: false
  tracing:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      robot-command:
        register-health-indicator: false

spring:
  cloud:
    loadbalancer:
      cache:
        enabled: false
